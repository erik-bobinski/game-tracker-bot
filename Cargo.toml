[package]
name = "riot-tracker-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.5.54", features = ["derive"] }
dotenv = "0.15.0"
poise = "0.6.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serenity = { version = "0.12.5" , features = ["framework", "standard_framework"]}
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.24.0"
